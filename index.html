<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111d" />
    <title>BOXAR | مكتبة عربية</title>
    <meta
      name="description"
      content="مكتبة BOXAR العربية: كتب تاريخية، دينية، رياضية، علمية وأدبية بجميع التخصصات."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand" aria-label="BOXAR">
          <div class="brand-mark">B</div>
          <div class="brand-text">
            <span class="brand-name">BOXAR</span>
            <small>مكتبة عربية</small>
          </div>
        </div>

        <nav class="main-nav" aria-label="التنقل الرئيسي">
          <a href="#home">الرئيسية</a>
          <a href="#categories">التصنيفات</a>
          <a href="#books">الكتب</a>
          <a href="#favorites">المفضلة</a>
        </nav>

        <button id="themeToggle" class="icon-btn" aria-label="تبديل المظهر">☼</button>
      </header>

      <main id="home">
        <section class="hero shell">
          <div class="hero-copy">
            <div class="eyebrow">
              <span class="pulse"></span>
              مكتبة عربية حديثة
            </div>
            <h1>اكتشف المعرفة في كل تخصص.</h1>
            <p>
              كتب تاريخية، دينية، رياضية، علمية، أدبية، وثقافية، semuanya في منصة
              عربية سهلة القراءة والوصول.
            </p>

            <div class="hero-actions">
              <button class="primary-btn">تصفح الكتب</button>
              <button class="secondary-btn">عرض التصنيفات</button>
            </div>

            <div class="hero-stats">
              <div>
                <strong>500+</strong>
                <span>كتاب</span>
              </div>
              <div>
                <strong>12</strong>
                <span>تصنيف</span>
              </div>
              <div>
                <strong>24/7</strong>
                <span>وصول</span>
              </div>
            </div>
          </div>

          <div class="hero-visual" aria-hidden="true">
            <div class="book-stack book-one"></div>
            <div class="book-stack book-two"></div>
            <div class="book-stack book-three"></div>
            <div class="orb orb-one"></div>
            <div class="orb orb-two"></div>
          </div>
        </section>

        <section class="search-shell shell">
          <label class="search-bar" for="searchInput">
            <span>🔎</span>
            <input
              id="searchInput"
              type="search"
              placeholder="ابحث عن كتاب أو مؤلف أو تصنيف"
              aria-label="بحث الكتب"
            />
          </label>
        </section>

        <section class="categories shell" id="categories">
          <div class="section-header">
            <h2>التصنيفات</h2>
            <a href="#books">عرض الكل</a>
          </div>
          <div id="categoryList" class="category-list" aria-label="قائمة التصنيفات"></div>
        </section>

        <section class="featured shell">
          <div class="section-header">
            <h2>الأكثر قراءة</h2>
            <a href="#books">المزيد</a>
          </div>

          <div id="featuredBooks" class="featured-grid"></div>
        </section>

        <section class="books shell" id="books">
          <div class="section-header">
            <h2>كل الكتب</h2>
            <span id="resultCount">0 كتاب</span>
          </div>

          <div id="booksGrid" class="books-grid" aria-live="polite"></div>
        </section>
      </main>

      <aside class="favorites-panel shell" id="favorites">
        <div class="section-header">
          <h2>المفضلة</h2>
          <span id="favoritesCount">0</span>
        </div>
        <div id="favoritesList" class="favorites-list"></div>
      </aside>

      <div id="bookModal" class="modal hidden" aria-hidden="true">
        <div class="modal-backdrop" data-close="true"></div>
        <div class="modal-card">
          <button class="close-btn" data-close="true" aria-label="إغلاق">×</button>
          <div class="modal-content" id="modalContent"></div>
        </div>
      </div>

      <nav class="bottom-nav" aria-label="التنقل السفلي">
        <button class="nav-item active" type="button">الرئيسية</button>
        <button class="nav-item" type="button">التصنيفات</button>
        <button class="nav-item" type="button">بحث</button>
        <button class="nav-item" type="button">حسابي</button>
      </nav>
    </div>

    <script src="app.js"></script>
  </body>
</html>
